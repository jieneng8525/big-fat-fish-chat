<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Favicon：与 AppLogo 组件同一图形。
    这里是静态文件，不能引用 CSS 变量，所以品牌蓝直接写死 #4D6BFE
    （与 theme.css 里的 --dsw-static-blue-500 一致）。
    SVG 里保留 width/height，某些浏览器对没有尺寸的 SVG favicon 不做缩放。
  -->
  <rect width="32" height="32" rx="9" fill="#4D6BFE"/>
  <path d="M10 8h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6.5l-4.6 3.4A.8.8 0 0 1 9.6 22.7V22a3 3 0 0 1-2.6-3V11a3 3 0 0 1 3-3z" fill="#fff"/>
  <rect x="12.2" y="13" width="2" height="4.4" rx="1" fill="#4D6BFE"/>
  <rect x="16" y="11.2" width="2" height="8" rx="1" fill="#4D6BFE"/>
  <rect x="19.8" y="13.4" width="2" height="3.6" rx="1" fill="#4D6BFE"/>
</svg>
